<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Formulaire Statique</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-container">
        <h2>Bilan des connaissances</h2>
        <p>Veuillez remplir ce formulaire pour valider le module.</p>
        
        <!-- Remplacez l'URL d'action par votre endpoint (ex: Web3Forms, Netlify ou Google Apps Script) -->
        <!-- Par défaut, nous mettons l'URL de test de Web3Forms -->
        <form id="monFormulaire">
            

            <div class="form-group">
                <label for="nom">Nom</label>
                <input type="text" id="nom" name="nom" required placeholder="Votre nom">
            </div>

            <div class="form-group">
                <label for="prenom">Prénom</label>
                <input type="text" id="prenom" name="prenom" required placeholder="Votre prénom">
            </div>

            <div class="form-group">
                <label for="question1">1. Cite les 5 étapes du cycle managérial.</label>
                <textarea id="question1" name="question1" rows="3" required placeholder="Votre réponse..."></textarea>
            </div>

            <button type="submit">Envoyer les réponses</button>
        </form>
    </div>
    <script>
    const form = document.getElementById('monFormulaire');
    
    form.addEventListener('submit', function(e) {
        e.preventDefault(); // Empêche la page de recharger
        
        const btn = form.querySelector('button');
        btn.innerText = "Envoi en cours..."; // Fait patienter l'utilisateur
        
        
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxgLIW1kXyvSXIYvXETsguP6WwgZWxYBvoDrO6nOcgr0UxJq7I5EiP0ZsiTZumye3ig/exec';
        
        fetch(scriptURL, { method: 'POST', body: new FormData(form) })
            .then(response => {
                alert("Super ! Vos réponses ont bien été enregistrées."); // Message de succès
                form.reset(); // Vide le formulaire
                btn.innerText = "Envoyer les réponses"; // Remet le bouton à la normale
            })
            .catch(error => {
                alert("Erreur lors de l'envoi.");
                btn.innerText = "Envoyer les réponses";
            });
    });
</script>
</body>
</html>
